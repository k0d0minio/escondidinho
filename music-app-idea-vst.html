// ══════════════════════════════════════════
// AUDIO ANALYSER — FFT pitch detection
// ══════════════════════════════════════════

// Convert frequency (Hz) to nearest MIDI note index 0-11 and octave
function freqToNoteInfo(freq){
  if(freq<=0)return null;
  const midi=Math.round(12*Math.log2(freq/440)+69);
  const noteIdx=((midi%12)+12)%12;
  const oct=Math.floor(midi/12)-1;
  return{noteIdx,note:NOTES[noteIdx],midi,oct,freq};
}

// Parabolic interpolation for better peak frequency accuracy
function refinePeak(magnitudes,idx){
  if(idx<=0||idx>=magnitudes.length-1)return idx;
  const a=magnitudes[idx-1],b=magnitudes[idx],c=magnitudes[idx+1];
  const denom=2*(2*b-a-c);
  if(denom===0)return idx;
  return idx+(a-c)/denom;
}

// ══════════════════════════════════════════════════════════════════════════════
// AUDIO ANALYSIS PIPELINE v4
// ──────────────────────────────────────────────────────────────────────────────
// Pipeline:
//   PCM → mono mix → Hann-windowed frames
//     → OfflineAudioContext native FFT (per frame)
//     → dB → linear magnitude spectrum
//     → NNLS-inspired harmonic summation per MIDI pitch (72 pitches, C2–B6)
//     → per-octave equalisation + bass-drum suppression
//     → cube-root dynamic compression
//     → confidence-weighted chroma accumulation
//     → L2 normalisation
//
// Key improvements over v3:
//  • Native browser FFT via OfflineAudioContext — zero Goertzel approximation
//  • Iterative harmonic residual subtraction (NNLS-lite): removes the energy
//    a strong low note "bleeds" into its octave above, dramatically reducing
//    false positives (e.g. C2 polluting C3 chroma bin)
//  • Two FFT sizes blended (32768 low / 8192 high) — low notes need frequency
//    resolution, high notes need time resolution
//  • Frame confidence weighting: frames with higher spectral clarity (sharper
//    peaks) contribute more to the final chroma
//  • Temperley 1999 key profiles added alongside K-S for ensemble voting
// ══════════════════════════════════════════════════════════════════════════════

// Precompute Hann windows once
const _hannWindows = {};
function hannWindow(n){
  if(_hannWindows[n]) return _hannWindows[n];
  const w = new Float32Array(n);
  for(let i=0;i<n;i++) w[i] = 0.5*(1 - Math.cos(2*Math.PI*i/n));
  return _hannWindows[n] = w;
}

// Get real FFT magnitude spectrum from a windowed PCM slice using
// OfflineAudioContext (browser native — fast & accurate).
// Returns Float32Array of linear magnitudes, length = fftSize/2.
async function nativeFFT(mono, offset, fftSize, sampleRate){
  const len = Math.min(fftSize, mono.length - offset);
  if(len < fftSize/2) return null;

  const win = hannWindow(fftSize);
  const slice = new Float32Array(fftSize);
  for(let i=0;i<len;i++) slice[i] = (mono[offset+i]||0) * win[i];

  // OfflineAudioContext: render exactly fftSize samples
  // iOS Safari: OfflineAudioContext pode falhar com sample rates > 44100
  const safeSampleRate = Math.min(sampleRate, 44100);
  const offCtx = new OfflineAudioContext(1, fftSize, safeSampleRate);
  const buf = offCtx.createBuffer(1, fftSize, sampleRate);
  buf.copyToChannel(slice, 0);

  const analyser = offCtx.createAnalyser();
  analyser.fftSize = fftSize;
  analyser.smoothingTimeConstant = 0; // no smoothing — we want raw frame data

  const src = offCtx.createBufferSource();
  src.buffer = buf;
  src.connect(analyser);
  analyser.connect(offCtx.destination);
  src.start(0);
  await offCtx.startRendering();

  const dB = new Float32Array(analyser.frequencyBinCount);
  analyser.getFloatFrequencyData(dB);

  // Convert dB → linear amplitude (not power — we want magnitude)
  const mag = new Float32Array(dB.length);
  for(let i=0;i<dB.length;i++){
    // -Infinity dB bins (silence) → 0
    mag[i] = dB[i] > -140 ? Math.pow(10, dB[i]/20) : 0;
  }
  return mag;
}

// Interpolated magnitude at a fractional bin position
function interpMag(mag, binF){
  const lo = Math.floor(binF), hi = lo+1;
  if(lo < 0 || hi >= mag.length) return 0;
  const t = binF - lo;
  return mag[lo]*(1-t) + mag[hi]*t;
}

// Compute NNLS-inspired harmonic salience for a single MIDI note.
// We sum mag at fundamental + harmonics, with:
//   • 1/sqrt(h) decay (gentler than 1/h² — real instruments have strong harmonics)
//   • subharmonic ghost check: if a lower pitch is very strong, discount this one
// Returns {salience, numH} 
function harmonicSalience(mag, freqPerBin, midiNote, sampleRate, numH=8){
  const freq0 = 440 * Math.pow(2, (midiNote-69)/12);
  let salience = 0, counted = 0;
  for(let h=1; h<=numH; h++){
    const hf = freq0 * h;
    if(hf > sampleRate*0.47) break;
    const binF = hf / freqPerBin;
    const m = interpMag(mag, binF);
    // 1/sqrt(h) decay — physically motivated by typical harmonic roll-off
    salience += m / Math.sqrt(h);
    counted++;
  }
  return salience;
}

// NNLS residual subtraction (one pass):
// Given a sorted list of pitch saliencies (high→low), subtract each pitch's
// harmonic contribution from the spectrum so it doesn't pollute higher octaves.
// This is a simplified version of what Chordino/NNLS-Chroma does.
function nnlsSubtract(mag, freqPerBin, saliencies, sampleRate){
  // Work on a copy
  const residual = Float32Array.from(mag);
  // Sort pitches by salience descending
  const sorted = saliencies.slice().sort((a,b)=>b.s-a.s);
  for(const {midi, s} of sorted){
    if(s < 1e-6) continue;
    const freq0 = 440 * Math.pow(2, (midi-69)/12);
    for(let h=1; h<=8; h++){
      const hf = freq0 * h;
      if(hf > sampleRate*0.47) break;
      const binF = hf / freqPerBin;
      const lo = Math.floor(binF), hi = lo+1;
      if(lo < 0 || hi >= residual.length) break;
      const contribution = s / Math.sqrt(h) * 0.6; // 60% removal — conservative
      residual[lo] = Math.max(0, residual[lo] - contribution*(1-(binF-lo)));
      residual[hi] = Math.max(0, residual[hi] - contribution*(binF-lo));
    }
  }
  return residual;
}

// Spectral flatness (0=pure tone, 1=white noise) — used for frame confidence.
// Frames with lower flatness (clearer pitch content) are more reliable.
function spectralFlatness(mag){
  let logSum=0, linSum=0, count=0;
  for(let i=0;i<mag.length;i++){
    if(mag[i]>1e-10){ logSum+=Math.log(mag[i]); linSum+=mag[i]; count++; }
  }
  if(!count || linSum===0) return 1;
  const geoMean = Math.exp(logSum/count);
  const ariMean = linSum/count;
  return geoMean/ariMean; // 0..1
}

// ── Main chroma extraction — returns full + temporal sections ─────────────────
// Returns {full, start, end} chroma vectors so findBestScales can detect
// tonal centre via temporal weighting (tónica tends to appear at phrase starts/ends)
async function buildChroma(audioBuffer){
  const sampleRate = audioBuffer.sampleRate;

  // Stereo → mono
  let mono;
  if(audioBuffer.numberOfChannels >= 2){
    const L = audioBuffer.getChannelData(0);
    const R = audioBuffer.getChannelData(1);
    mono = new Float32Array(L.length);
    for(let i=0;i<L.length;i++) mono[i]=(L[i]+R[i])*0.5;
  } else {
    mono = audioBuffer.getChannelData(0);
  }

  const MIDI_LO = 36, MIDI_HI = 95;
  const FFT_LARGE = 32768;
  const FFT_SMALL =  8192;
  const HOP = Math.floor(sampleRate * 0.20);
  const totalSamps = mono.length;
  const maxFrames = Math.min(50, Math.max(6, Math.floor(totalSamps / HOP)));
  const frameSpacing = Math.max(1, Math.floor(totalSamps / maxFrames));

  // We'll keep per-frame chroma to extract start/end sections
  const allFrameChroma = []; // [{chroma, confidence, position}]  position: 0..1

  for(let fi=0; fi<maxFrames; fi++){
    const offset = fi * frameSpacing;
    if(offset + FFT_LARGE >= totalSamps) break;

    let rms=0;
    const rmsLen = Math.min(4096, totalSamps-offset);
    for(let i=0;i<rmsLen;i++) rms+=mono[offset+i]**2;
    if(Math.sqrt(rms/rmsLen) < 1e-4) continue;

    const [magLarge, magSmall] = await Promise.all([
      nativeFFT(mono, offset, FFT_LARGE, sampleRate),
      nativeFFT(mono, offset, FFT_SMALL,  sampleRate),
    ]);
    if(!magLarge || !magSmall) continue;

    const freqPerBinL = sampleRate / FFT_LARGE;
    const freqPerBinS = sampleRate / FFT_SMALL;

    const binLo = Math.floor(60/freqPerBinL), binHi = Math.floor(4000/freqPerBinL);
    const flatness = spectralFlatness(magLarge.slice(binLo, binHi));
    const confidence = Math.max(0.1, 1 - flatness);

    const rawSaliencies = [];
    for(let midi=MIDI_LO; midi<=MIDI_HI; midi++){
      const useLarge = midi < 72;
      const mag = useLarge ? magLarge : magSmall;
      const fpb = useLarge ? freqPerBinL : freqPerBinS;
      const numH = useLarge ? 8 : 5;
      const s = harmonicSalience(mag, fpb, midi, sampleRate, numH);
      rawSaliencies.push({midi, s});
    }

    const residualMag = nnlsSubtract(magLarge, freqPerBinL, rawSaliencies, sampleRate);

    const frameChroma = new Float64Array(12);
    for(let midi=MIDI_LO; midi<=MIDI_HI; midi++){
      const idx = midi - MIDI_LO;
      let s;
      if(midi < 72){
        const sOrig  = rawSaliencies[idx].s;
        const sResid = harmonicSalience(residualMag, freqPerBinL, midi, sampleRate, 8);
        s = sOrig*0.6 + sResid*0.4;
      } else {
        s = rawSaliencies[idx].s;
      }
      if(s < 1e-8) continue;
      const octWeight = midi < 60 ? 0.25 + 0.75*(midi-36)/24 : 1.0;
      const nc = ((midi%12)+12)%12;
      frameChroma[nc] += s * octWeight;
    }

    // Cube-root compression
    const compressed = new Float64Array(12);
    for(let i=0;i<12;i++) compressed[i] = Math.cbrt(frameChroma[i]);

    allFrameChroma.push({
      chroma: compressed,
      confidence,
      position: offset / totalSamps,  // 0=start, 1=end
    });
  }

  if(allFrameChroma.length === 0) return {
    full: new Float64Array(12).fill(1/12),
    start: new Float64Array(12).fill(1/12),
    end:   new Float64Array(12).fill(1/12),
  };

  // ── Aggregate: full, start (first 25%), end (last 25%) ──────────────────
  function weightedMean(frames, weightFn){
    const acc = new Float64Array(12);
    let wTotal = 0;
    for(const f of frames){
      const w = f.confidence * weightFn(f.position);
      for(let i=0;i<12;i++) acc[i] += f.chroma[i] * w;
      wTotal += w;
    }
    if(wTotal > 0) for(let i=0;i<12;i++) acc[i] /= wTotal;
    return acc;
  }

  function l2norm(v){
    let n=0; for(let i=0;i<12;i++) n+=v[i]*v[i];
    n=Math.sqrt(n)||1; const out=new Float64Array(12);
    for(let i=0;i<12;i++) out[i]=v[i]/n; return out;
  }

  const full  = l2norm(weightedMean(allFrameChroma, ()=>1));
  // Start: frames in first 25%, weighted by proximity to start
  const start = l2norm(weightedMean(allFrameChroma, p=> p<0.35 ? (1-p/0.35)*2+1 : 0.1));
  // End: frames in last 25%, weighted by proximity to end
  const end   = l2norm(weightedMean(allFrameChroma, p=> p>0.65 ? ((p-0.65)/0.35)*2+1 : 0.1));

  return {full, start, end};
}

// Analyse an AudioBuffer — async because buildChroma uses OfflineAudioContext
async function analyseBuffer(audioBuffer){
  const chromaData = await buildChroma(audioBuffer);
  // Store temporal data on audioBuffer for findBestScales
  audioBuffer._chromaData = chromaData;

  const chroma = chromaData.full;
  const maxC = Math.max(...chroma);
  if(maxC===0) return [];
  const notes = NOTES.map((n,i)=>({note:n, noteIdx:i, strength:chroma[i]/maxC}));
  notes.sort((a,b)=>b.strength-a.strength);
  // Attach chromaData to notes array for findBestScales to use
  notes._chromaData = chromaData;
  return notes;
}

// ── Key profiles: K-S (1982) + Temperley (1999) ensemble ────────────────────
// Using two independent profile sets and averaging their correlations reduces
// over-fitting to one theory — ensemble of models outperforms any single model.
const KS_MAJOR = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const KS_MINOR = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
// Temperley 1999 "Simple" profiles (from "What's Key for Key?")
const TP_MAJOR = [5.0,2.0,3.5,2.0,4.5,4.0,2.0,4.5,2.0,3.5,1.5,4.0];
const TP_MINOR = [5.0,2.0,3.5,4.5,2.0,4.0,2.0,4.5,3.5,2.0,1.5,4.0];

function pearson(a, b){
  // Pearson correlation coefficient between two 12-element arrays
  const n = a.length;
  let ma=0, mb=0;
  for(let i=0;i<n;i++){ma+=a[i]; mb+=b[i];}
  ma/=n; mb/=n;
  let num=0, da2=0, db2=0;
  for(let i=0;i<n;i++){
    const da=a[i]-ma, db=b[i]-mb;
    num+=da*db; da2+=da*da; db2+=db*db;
  }
  return num / (Math.sqrt(da2)*Math.sqrt(db2) || 1);
}

// ── Per-scale degree-salience profiles ──────────────────────────────────────
// For each scale type, maps each interval to a psychoacoustic importance weight.
// These differ between major and minor modes — that's the key to telling them apart.
const SCALE_PROFILES = {
  // Major: strong root, M3 (4), P5 (7), leading tone (11)
  "Maior":           {0:2.5, 2:1.0, 4:1.8, 5:1.1, 7:2.0, 9:1.0, 11:1.4},
  // Natural minor: strong root, m3 (3), P5 (7), b7 (10) — NO leading tone
  "Menor Natural":   {0:2.5, 2:1.0, 3:1.8, 5:1.1, 7:2.0, 8:0.9, 10:1.3},
  // Harmonic minor: like minor but raised 7th (11) creates strong leading tone pull
  "Menor Harmônica": {0:2.5, 2:1.0, 3:1.8, 5:1.1, 7:2.0, 8:0.9, 11:1.6},
  // Melodic minor: raised 6th (9) and 7th (11) ascending
  "Menor Melódica":  {0:2.5, 2:1.0, 3:1.8, 5:1.1, 7:2.0, 9:1.2, 11:1.5},
  // Dorian: minor feel but M6 (9) is characteristic
  "Dórica":          {0:2.0, 2:1.0, 3:1.5, 5:1.1, 7:1.8, 9:1.6, 10:1.0},
  // Phrygian: characteristic b2 (1)
  "Frígia":          {0:2.0, 1:1.8, 3:1.2, 5:1.0, 7:1.5, 8:1.0, 10:1.0},
  // Lydian: characteristic #4 (6)
  "Lídia":           {0:2.0, 2:1.0, 4:1.6, 6:1.8, 7:1.8, 9:1.0, 11:1.2},
  // Mixolydian: major-ish but b7 (10) is key
  "Mixolídia":       {0:2.0, 2:1.0, 4:1.6, 5:1.1, 7:1.8, 9:1.0, 10:1.6},
  // Locrian: b2 (1), b5 (6) characteristic
  "Lócria":          {0:2.0, 1:1.5, 3:1.2, 5:1.0, 6:1.8, 8:1.0, 10:1.0},
  // Phrygian dominant: b2 (1) + M3 (4) = strong Spanish/flamenco colour
  "Frígia Dominante":{0:2.2, 1:1.9, 4:1.9, 5:1.1, 7:1.6, 8:1.0, 10:1.0},
  // Pentatonic major: only 5 notes, root + M2 + M3 + P5 + M6
  "Pentatônica Maior":{0:2.5, 2:1.3, 4:1.8, 7:2.0, 9:1.3},
  // Pentatonic minor: root + m3 + P4 + P5 + m7
  "Pentatônica Menor":{0:2.5, 3:1.8, 5:1.3, 7:2.0, 10:1.3},
  // Blues: pentatonic minor + b5 (6)
  "Blues":           {0:2.5, 3:1.6, 5:1.3, 6:1.8, 7:1.8, 10:1.3},
  // Blues major: add b3 colour note
  "Blues Maior":     {0:2.5, 2:1.3, 3:1.5, 4:1.5, 7:2.0, 9:1.2},
  // Hungarian minor: #4 (6) + b6 (8) + leading tone (11)
  "Húngara Menor":   {0:2.0, 2:1.0, 3:1.5, 6:1.9, 7:1.8, 8:1.5, 11:1.6},
  // Arabic: b2 (2)? Actually [0,2,4,5,6,8,10] — has #4 and b7
  "Árabe":           {0:2.0, 2:1.2, 4:1.4, 5:1.1, 6:1.8, 8:1.2, 10:1.3},
  // Japanese: [0,1,5,7,8] very sparse — b2 and b6 distinctive
  "Japonesa":        {0:2.5, 1:2.0, 5:1.5, 7:2.0, 8:1.8},
  // Bebop dominant: [0,2,4,5,7,9,10,11] — passing tone between b7 and root
  "Bebop Dominante": {0:2.0, 2:1.0, 4:1.5, 5:1.0, 7:1.8, 9:1.0, 10:1.5, 11:1.3},
};

// Fallback uniform weights for any scale not listed above
function getScaleWeights(scaleName, intervals){
  const profile = SCALE_PROFILES[scaleName];
  if(profile) return profile;
  const w = {};
  intervals.forEach(iv=>{ w[iv] = iv===0 ? 2.0 : 1.0; });
  return w;
}

// Find best matching scales given note strengths
function findBestScales(noteStrengths){
  const results=[];

  // Get full + temporal chroma vectors
  const chromaData = noteStrengths._chromaData || null;
  const chromaFull  = new Array(12).fill(0);
  noteStrengths.forEach(n=>{ chromaFull[n.noteIdx]=n.strength; });

  // Temporal vectors: if available, use them; otherwise fall back to full
  const chromaStart = chromaData ? Array.from(chromaData.start) : chromaFull;
  const chromaEnd   = chromaData ? Array.from(chromaData.end)   : chromaFull;

  // ── Ensemble key profiles ────────────────────────────────────────────────
  // For each root: compute KS+Temperley correlation on full chroma,
  // PLUS temporal bonus: how strong is the root note at the start and end?
  // The tónica of a piece almost always appears prominently at start and end.
  const ksMap = {};
  for(let root=0; root<12; root++){
    const rotFull  = Array.from({length:12},(_,i)=>chromaFull[(i+root)%12]);
    const rotStart = Array.from({length:12},(_,i)=>chromaStart[(i+root)%12]);
    const rotEnd   = Array.from({length:12},(_,i)=>chromaEnd[(i+root)%12]);

    const ksMaj = pearson(rotFull, KS_MAJOR);
    const ksMin = pearson(rotFull, KS_MINOR);
    const tpMaj = pearson(rotFull, TP_MAJOR);
    const tpMin = pearson(rotFull, TP_MINOR);

    // Temporal tonic salience: how much does the root note stand out
    // at the beginning and end compared to its neighbours?
    // We look at chroma[0] (the root, after rotation) vs surrounding notes.
    // A strong root at start+end is a very reliable tonic indicator.
    const tonicAtStart = rotStart[0]; // root strength at piece start
    const tonicAtEnd   = rotEnd[0];   // root strength at piece end
    // Fifth (index 7) and third (4 or 3) presence also helps confirm key
    const fifthAtStart = rotStart[7];
    const fifthAtEnd   = rotEnd[7];
    // Tonic salience bonus: 0..~0.3
    const tonicBonusMaj = (tonicAtStart + tonicAtEnd + fifthAtStart*0.5 + fifthAtEnd*0.5) * 0.18;
    // For minor, minor third (index 3) instead of major third
    const minThirdStart = rotStart[3];
    const minThirdEnd   = rotEnd[3];
    const tonicBonusMin = (tonicAtStart + tonicAtEnd + fifthAtStart*0.5 + fifthAtEnd*0.5 + minThirdStart*0.3 + minThirdEnd*0.3) * 0.18;

    // Disambiguação maior/menor:
    // Maior e menor relativas partilham as mesmas 7 notas (ex: C maior = A menor).
    // Para distinguir, combinamos start+end+full — evita depender só de fade-in/out.
    const relMinRoot = (root + 9) % 12; // relativa menor (ex: C maior → A menor)
    const relMajRoot = (root + 3) % 12; // relativa maior (ex: A menor → C maior)

    const ourRootSalience = (chromaStart[root]      + chromaEnd[root])      * 0.40
                          +  chromaFull[root]                                * 0.20;
    const relMinSalience  = (chromaStart[relMinRoot] + chromaEnd[relMinRoot]) * 0.40
                          +  chromaFull[relMinRoot]                           * 0.20;
    const relMajSalience  = (chromaStart[relMajRoot] + chromaEnd[relMajRoot]) * 0.40
                          +  chromaFull[relMajRoot]                           * 0.20;

    const majRelDelta = ourRootSalience - relMinSalience;
    const minRelDelta = ourRootSalience - relMajSalience;

    // Bónus modal: leading tone (intervalo 11) favorece maior; subtónica (10) favorece menor.
    const leadingToneMaj = chromaFull[(root + 11) % 12];
    const subtonic       = chromaFull[(root + 10) % 12];
    const modalBonus = (leadingToneMaj - subtonic) * 0.15;

    ksMap[`${root}_Maior`]           = (ksMaj + tpMaj)/2 + tonicBonusMaj + majRelDelta * 0.30 + modalBonus;
    ksMap[`${root}_Menor Natural`]   = (ksMin + tpMin)/2 + tonicBonusMin + minRelDelta * 0.30 - modalBonus;
    // Menor harmónica: tem leading tone → beneficia do KS menor + bónus de VII#
    ksMap[`${root}_Menor Harmônica`] = (ksMin + tpMin)/2 + tonicBonusMin + minRelDelta * 0.30 + leadingToneMaj * 0.10;
    // Menor melódica: VI e VII elevados → sinal combinado
    const raisedSixth = chromaFull[(root + 9) % 12];
    ksMap[`${root}_Menor Melódica`]  = (ksMin + tpMin)/2 + tonicBonusMin + minRelDelta * 0.30 + (leadingToneMaj + raisedSixth) * 0.07;
  }

  // ── Score every (root, scale) pair ──────────────────────────────────────
  Object.keys(SCALES).forEach(scaleName=>{
    if(scaleName==="Cromática") return;

    const intervals = SCALES[scaleName];
    const scaleSize = intervals.length;
    const outSize   = Math.max(1, 12 - scaleSize);
    const weights   = getScaleWeights(scaleName, intervals);

    NOTES.forEach((rootNote, rootIdx)=>{
      const scaleSet = new Set(intervals.map(iv=>(rootIdx+iv)%12));

      let inScore=0, matched=0;

      scaleSet.forEach(ni=>{
        const iv = (ni - rootIdx + 12) % 12;
        const w  = weights[iv] ?? 1.0;
        const s  = chromaFull[ni] ?? 0;
        inScore += s * w;
        if(s > 0.10) matched++;
      });

      // ── Tension-aware out-of-scale penalty ──────────────────────────────
      // Notas fora da escala podem ser:
      //   (a) notas de tensão intencional (secondary dominants, empréstimos modais,
      //       blue notes, cromatismos) → penalizar suavemente
      //   (b) ruído / notas irrelevantes muito fracas → quase ignorar
      //   (c) notas fortes que realmente não pertencem → penalizar muito
      //
      // Estratégia:
      //   1. Ordenar as notas fora da escala por energia (descendente).
      //   2. A nota fora mais forte recebe um "perdão de tensão" parcial —
      //      a sua penalização é reduzida em até 60%, modelando o facto de
      //      que UMA nota de tensão proeminente é musical e esperada.
      //   3. A segunda nota fora mais forte recebe perdão parcial menor (30%).
      //   4. Restantes notas fora são penalizadas normalmente.
      //   5. Notas fora com energia < 0.08 (quase inaudíveis) são ignoradas.
      const outNotes = [];
      for(let ni=0;ni<12;ni++){
        if(!scaleSet.has(ni)){
          const s = chromaFull[ni] ?? 0;
          if(s > 0.08) outNotes.push(s); // ignorar ruído muito fraco
        }
      }
      outNotes.sort((a,b)=>b-a); // ordem decrescente

      let outScore = 0;
      outNotes.forEach((s, i)=>{
        if(i === 0)      outScore += s * 0.40; // 1ª nota fora: 60% de perdão
        else if(i === 1) outScore += s * 0.70; // 2ª nota fora: 30% de perdão
        else             outScore += s * 1.00; // restantes: penalização total
      });

      const numOutRelevant = Math.max(1, outNotes.length);
      const sumWeights = intervals.reduce((a,iv)=>a+(weights[iv]??1.0),0);
      const normIn  = inScore / sumWeights;
      const normOut = outScore / numOutRelevant;
      const coverageBonus = (matched / scaleSize) * 0.12;
      let score = normIn - normOut * 0.65 + coverageBonus;

      // Para escalas com perfil KS calculado: o ensemble KS domina o score final.
      // Maior e todas as variantes menores beneficiam do KS para distinguir modo.
      const KS_SCALES = ["Maior","Menor Natural","Menor Harmônica","Menor Melódica"];
      if(KS_SCALES.includes(scaleName)){
        const ks = ksMap[`${rootIdx}_${scaleName}`] ?? 0;
        const ksNorm = (ks + 0.5) / 1.3;
        // Maior e Menor Natural são os mais fiáveis no KS; harmónica/melódica menos
        const ksWeight = (scaleName==="Maior"||scaleName==="Menor Natural") ? 0.75 : 0.60;
        score = ksNorm * ksWeight + score * (1 - ksWeight);
      }

      results.push({
        rootNote, scaleName, score, matched,
        total: scaleSize,
        coverage: matched / scaleSize,
      });
    });
  });

  results.sort((a,b)=>b.score-a.score);

  // Tonal gravity tiebreak:
  // Para cada escala candidata no grupo top, calcular quanto "peso tonal"
  // a sua raiz acumula considerando as notas I (raiz), IV e V no chroma.
  // Isto evita que o grau 5 (ex: C em F Maior) seja confundido com a tónica.
  const noteStrengthMap = {};
  noteStrengths.forEach(n => { noteStrengthMap[n.note] = n.strength; });

  function tonalGravity(rootNote){
    const rootIdx = NOTES.indexOf(rootNote);
    const fourth  = NOTES[(rootIdx + 5) % 12];  // IV
    const fifth   = NOTES[(rootIdx + 7) % 12];  // V
    const root    = noteStrengthMap[rootNote] || 0;
    const iv      = noteStrengthMap[fourth]   || 0;
    const v       = noteStrengthMap[fifth]    || 0;
    // Raiz pesa mais, IV e V confirmam o centro tonal
    return root * 2.0 + iv * 1.0 + v * 1.0;
  }

  const topScore = results[0]?.score || 0;
  const tied = results.filter(r => r.score >= topScore * 0.97);

  function tonalGravity(rootNote){
    const rootIdx = NOTES.indexOf(rootNote);
    const fourth  = NOTES[(rootIdx + 5) % 12];  // IV
    const fifth   = NOTES[(rootIdx + 7) % 12];  // V
    const root    = noteStrengthMap[rootNote] || 0;
    const iv      = noteStrengthMap[fourth]   || 0;
    const v       = noteStrengthMap[fifth]    || 0;
    let gravity = root * 2.0 + iv * 1.0 + v * 1.0;

    // Penalizar se esta raiz é o grau V de outra candidata no tied group
    // Ex: C é o V de F — se F está no grupo, C perde peso
    const isFifthOfAnother = tied.some(r => {
      if(r.rootNote === rootNote) return false;
      const otherRootIdx = NOTES.indexOf(r.rootNote);
      const otherFifth = NOTES[(otherRootIdx + 7) % 12];
      return otherFifth === rootNote;
    });
    if(isFifthOfAnother) gravity *= 0.75;

    return gravity;
  }

  if(tied.length > 1){
    tied.sort((a,b) => tonalGravity(b.rootNote) - tonalGravity(a.rootNote));
    const winnerRoot = tied[0].rootNote;
    const winnerCandidates = tied.filter(r => r.rootNote === winnerRoot);
    if(winnerCandidates.length > 1){
      const rootIdx = NOTES.indexOf(winnerRoot);
      // Calcular as notas únicas de cada escala (que a diferenciam das outras)
      const allNoteSets = winnerCandidates.map(r =>
        new Set(SCALES[r.scaleName].map(iv => (rootIdx+iv)%12))
      );
      winnerCandidates.sort((a,b) => {
        const setA = new Set(SCALES[a.scaleName].map(iv => (rootIdx+iv)%12));
        const setB = new Set(SCALES[b.scaleName].map(iv => (rootIdx+iv)%12));
        // Notas que só existem em A (não em B) — são as que distinguem A de B
        let uniqueScoreA = 0, uniqueScoreB = 0;
        setA.forEach(ni => { if(!setB.has(ni)) uniqueScoreA += chromaFull[ni] || 0; });
        setB.forEach(ni => { if(!setA.has(ni)) uniqueScoreB += chromaFull[ni] || 0; });
        return uniqueScoreB - uniqueScoreA;
      });
    }
    const winner = winnerCandidates[0];
    const idx = results.indexOf(winner);
    if(idx > 0){ results.splice(idx,1); results.unshift(winner); }
  }

  return results;
}

// Detect chord candidates from active notes
function detectChordsFromNotes(topNotes){
  // Use top notes with strength > 0.2
  const active=topNotes.filter(n=>n.strength>0.2).map(n=>n.note);
  if(active.length<2)return[];
  // Use existing chord detection logic from acordes page
  const results=[];
  NOTES.forEach((root,ri)=>{
    Object.entries(CHORD_TYPES).forEach(([type,ivs])=>{
      const chordNotes=ivs.map(iv=>NOTES[(ri+iv)%12]);
      const matches=chordNotes.filter(n=>active.includes(n)).length;
      const coverage=matches/chordNotes.length;
      const extra=active.filter(n=>!chordNotes.includes(n)).length;
      if(matches>=2&&coverage>=0.6){
        results.push({root,type,ivs,ri,matches,coverage,extra,score:coverage*matches-extra*0.3});
      }
    });
  });
  results.sort((a,b)=>b.score-a.score);
  return results.slice(0,6);
}

function processAudioFile(file){
  const resultsDiv=document.getElementById("audio-results");
  if(!resultsDiv)return;

  // iOS Safari: AudioContext tem de ser criado/resumido dentro de gesto do utilizador.
  // Criar agora (ainda estamos no call stack do evento de toque).
  if(!_ctx){_ctx=new(window.AudioContext||window.webkitAudioContext)();}
  if(_ctx.state==="suspended")_ctx.resume();

  resultsDiv.innerHTML=`<div style="text-align:center;padding:30px 0">
    <div style="font-size:28px;margin-bottom:8px">⏳</div>
    <div id="analysis-status" style="font-size:12px;color:#6B5FBB">A descodificar ${file.name}…</div>
    <div style="font-size:10px;color:#3D3660;margin-top:4px">${Math.round(file.size/1024)}KB · análise harmónica multi-frame</div>
  </div>`;

  const setStatus=msg=>{const el=document.getElementById("analysis-status");if(el)el.textContent=msg;};

  const reader=new FileReader();
  reader.onerror=()=>{
    if(resultsDiv)resultsDiv.innerHTML=`<div style="text-align:center;padding:20px;color:#EF4444;font-size:12px">❌ Erro ao ler o ficheiro.</div>`;
  };
  reader.onload=async e=>{
    const arrayBuffer=e.target.result;
    try{
      // iOS Safari requer Promise-based decodeAudioData
      const ctx=getCtx();
      let audioBuffer;
      try{
        audioBuffer=await ctx.decodeAudioData(arrayBuffer);
      }catch(decodeErr){
        // Fallback: alguns browsers antigos só aceitam callback
        audioBuffer=await new Promise((res,rej)=>{
          const ctx2=getCtx();
          ctx2.decodeAudioData(arrayBuffer.slice(0),res,rej);
        });
      }
      setStatus("A extrair chroma com HPS…");
      await new Promise(r=>setTimeout(r,30));
      const noteStrengths=await analyseBuffer(audioBuffer);
      setStatus("A calcular escalas com Krumhansl-Schmuckler…");
      await new Promise(r=>setTimeout(r,10));
      const topScales=findBestScales(noteStrengths);
      const topChords=detectChordsFromNotes(noteStrengths);
      const result={fileName:file.name,duration:audioBuffer.duration,sampleRate:audioBuffer.sampleRate,noteStrengths,topScales:topScales.slice(0,8),topChords,_audioBuffer:audioBuffer};
      S._audioAnalysis=result;
      if(resultsDiv)renderAudioResults(resultsDiv,result);
    }catch(err){
      console.error("Analysis error:",err);
      if(resultsDiv)resultsDiv.innerHTML=`<div style="text-align:center;padding:20px;color:#EF4444;font-size:12px">❌ Erro: ${err.message||err}<br><span style="font-size:10px;color:#6B5FBB">Tenta um ficheiro mp3 ou wav mais curto.</span></div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

// ══ MIDI REAL-TIME CAPTURE ══════════════════════════════════════════════════
// Piano roll profissional: onset detection + editor completo + MIDI com timing
// Inspirado em Melodyne / Note Grabber
// ════════════════════════════════════════════════════════════════════════════
let _midiCapState = null;

// ── Onset Detection (simplificado mas funcional) ─────────────────────────
// Detecta quando uma nota começa e termina com base em energia + salience
function detectOnsets(salienceHistory, midiNote, sampleRate, hopSamples){
  const notes = [];
  let inNote = false, startFrame = 0, maxStr = 0;
  const THRESHOLD = 0.28, RELEASE = 0.12, MIN_DUR = 3;
  for(let i = 0; i < salienceHistory.length; i++){
    const s = salienceHistory[i][midiNote] || 0;
    if(!inNote && s > THRESHOLD){ inNote = true; startFrame = i; maxStr = s; }
    else if(inNote){
      if(s > maxStr) maxStr = s;
      if(s < RELEASE || i === salienceHistory.length - 1){
        const dur = i - startFrame;
        if(dur >= MIN_DUR){
          const tStart = (startFrame * hopSamples) / sampleRate;
          const tEnd   = (i * hopSamples) / sampleRate;
          notes.push({ midiNote, tStart, tEnd, velocity: Math.min(127, Math.round(maxStr * 127)), strength: maxStr });
        }
        inNote = false; maxStr = 0;
      }
    }
  }
  return notes;
}

// ── Análise completa do buffer com onset detection ────────────────────────
async function analyseMidiFromBuffer(audioBuffer, progressCb){
  const sampleRate = audioBuffer.sampleRate;
  let mono;
  if(audioBuffer.numberOfChannels >= 2){
    const L = audioBuffer.getChannelData(0), R = audioBuffer.getChannelData(1);
    mono = new Float32Array(L.length);
    for(let i=0;i<L.length;i++) mono[i]=(L[i]+R[i])*0.5;
  } else { mono = audioBuffer.getChannelData(0); }

  const FFT_SIZE   = 4096;
  const HOP        = Math.floor(sampleRate * 0.046); // ~46ms hop
  const MIDI_LOW   = 36, MIDI_HIGH = 96;
  const freqPerBin = sampleRate / FFT_SIZE;
  const totalFrames = Math.floor((mono.length - FFT_SIZE) / HOP);
  const salienceHistory = []; // frame × midi → salience

  // Hann window
  const hann = new Float32Array(FFT_SIZE);
  for(let i=0;i<FFT_SIZE;i++) hann[i] = 0.5*(1-Math.cos(2*Math.PI*i/FFT_SIZE));

  // Process frames in chunks to avoid blocking UI
  const CHUNK = 20;
  for(let fi = 0; fi < totalFrames; fi++){
    const offset = fi * HOP;
    if(offset + FFT_SIZE >= mono.length) break;

    // Apply Hann window + build real FFT via OfflineAudioContext
    const windowed = new Float32Array(FFT_SIZE);
    for(let i=0;i<FFT_SIZE;i++) windowed[i] = mono[offset+i] * hann[i];

    // Simple DFT magnitude for MIDI notes (optimized: only compute needed bins)
    const frameSal = {};
    for(let m = MIDI_LOW; m <= MIDI_HIGH; m++){
      const f0 = 440 * Math.pow(2,(m-69)/12);
      let salience = 0;
      for(let h = 1; h <= 6; h++){
        const hf = f0 * h;
        if(hf > sampleRate * 0.49) break;
        const binF = hf / freqPerBin;
        const bin  = Math.round(binF);
        if(bin >= FFT_SIZE/2) break;
        // Goertzel for this bin
        const omega = 2 * Math.PI * bin / FFT_SIZE;
        const coeff = 2 * Math.cos(omega);
        let q1 = 0, q2 = 0;
        for(let i=0;i<FFT_SIZE;i++){ const q0 = coeff*q1 - q2 + windowed[i]; q2=q1; q1=q0; }
        const mag = Math.sqrt(q1*q1 + q2*q2 - q1*q2*coeff) / (FFT_SIZE/2);
        salience += mag / Math.sqrt(h);
      }
      if(salience > 0.01) frameSal[m] = Math.min(1, salience * 3.5);
    }
    salienceHistory.push(frameSal);

    if(fi % CHUNK === 0){ progressCb && progressCb(fi/totalFrames); await new Promise(r=>setTimeout(r,0)); }
  }

  // Detect onsets for each MIDI note
  const allNotes = [];
  for(let m = MIDI_LOW; m <= MIDI_HIGH; m++){
    const notes = detectOnsets(salienceHistory, m, sampleRate, HOP);
    allNotes.push(...notes);
  }
  allNotes.sort((a,b) => a.tStart - b.tStart);

  // Estimate BPM from onset density
  const onsetTimes = allNotes.map(n=>n.tStart);
  let bpmEst = 120;
  if(onsetTimes.length >= 4){
    const iois = [];
    for(let i=1;i<Math.min(onsetTimes.length,30);i++) iois.push(onsetTimes[i]-onsetTimes[i-1]);
    iois.sort((a,b)=>a-b);
    const medIoi = iois[Math.floor(iois.length/2)];
    if(medIoi > 0.1 && medIoi < 2.0) bpmEst = Math.round(60 / medIoi);
    bpmEst = Math.max(60, Math.min(200, bpmEst));
  }

  return { notes: allNotes, bpmEst, duration: mono.length / sampleRate, salienceHistory, hopSec: HOP/sampleRate };
}

      if(st.playheadT > st.viewEnd - (st.viewEnd-st.viewStart)*0.1){
        const span = st.viewEnd - st.viewStart;
        st.viewStart = Math.min(st.playheadT - span*0.1, durationSec - span);
        st.viewEnd   = Math.min(st.viewStart + span, durationSec);
      }
      drawRoll();
      _playAnimFrame = requestAnimationFrame(animPlayhead);
    }
    _playAnimFrame = requestAnimationFrame(animPlayhead);
  }

    if(actx.state === "suspended") actx.resume();
    const offset = (st.playheadT !== undefined && st.playheadT < st.duration) ? st.playheadT : 0;
    _playSource = actx.createBufferSource();

    }
    const actx = window._audioCtx || (window._audioCtx = new(window.AudioContext||window.webkitAudioContext)());
    if(actx.state === "suspended") actx.resume();
    const offset = (st.playheadT !== undefined && st.playheadT < st.duration) ? st.playheadT : 0;
    const now = performance.now();
    // Schedule each note via setTimeout (offset-aware)
    st.notes.forEach(n=>{

      const tE = n.tEnd   !== undefined ? n.tEnd   : (n.tMs + (n.durMs||300))/1000;

      const midiN = n.midiNote;
      const noteIdx = midiN % 12;

        playNote(noteIdx, oct, dur * 1.1, vol);
        flashNote(NOTES[noteIdx], Math.min(dur*1000, 800));
      }, delay);
      _pianoTimeouts.push(id);
    });
    // Auto-stop after duration
    const totalDelay = (st.duration - offset) * 1000 + 200;
    const endId = setTimeout(()=>stopAudioPlayback(), totalDelay);
    _pianoTimeouts.push(endId);
    startPlayheadAnim(offset, st.duration);
  }

  // ══ PIANO ROLL DRAW ENGINE ═════════════════════════════════════════════════
  function midiToY(m, H){
    // Mapeia MIDI_HIGH (top) → 0, MIDI_LOW (bottom) → H
    return H - ((m - MIDI_LOW) / MIDI_COUNT) * H;
  }
  function tToX(t, W){
    const span = st.viewEnd - st.viewStart;
    return KEY_W + ((t - st.viewStart) / span) * (W - KEY_W);
  }
  function xToT(x, W){
    const span = st.viewEnd - st.viewStart;
    return st.viewStart + ((x - KEY_W) / (W - KEY_W)) * span;
  }
  function yToMidi(y, H){
    return Math.round(MIDI_HIGH - (y / H) * MIDI_COUNT);
  }

  function drawRoll(){
    const canvas = st.rollCanvas;
    const ctx2d  = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    ctx2d.clearRect(0,0,W,H);

    const noteH = H / MIDI_COUNT;

    // ── Grid de fundo ──────────────────────────────────────────────────────
    for(let m = MIDI_LOW; m <= MIDI_HIGH; m++){
      const ni = m % 12;
      const isBlack = [1,3,6,8,10].includes(ni);
      const y = midiToY(m, H);
      ctx2d.fillStyle = isBlack ? "rgba(0,0,0,0.22)" : (m%12===0?"rgba(100,80,200,0.06)":"rgba(255,255,255,0.012)");
      ctx2d.fillRect(KEY_W, y, W-KEY_W, noteH);
    }

    // ── HEATMAP DE FREQUÊNCIAS (salience) ─────────────────────────────────
    // Desenhado por trás das notas MIDI, como o Note Grabber / Melodyne
    const sal = st.showHeatmap ? (st.salienceHistory || st.liveSalience) : null;
    if(sal && sal.length > 0){
      const hop = st.hopSec || 0.046;
      const span = st.viewEnd - st.viewStart;
      // Largura de cada coluna de heatmap em pixels (1 frame = hop segundos)
      const colW = Math.max(1, ((hop / span) * (W - KEY_W)));

      // Pre-build per-note colour lookups
      const noteRGB = [];
      for(let m = MIDI_LOW; m <= MIDI_HIGH; m++){
        const col = NC[NOTES[m%12]] || "#818CF8";
        noteRGB.push([parseInt(col.slice(1,3),16), parseInt(col.slice(3,5),16), parseInt(col.slice(5,7),16)]);
      }

      // Find max salience for normalisation
      let maxSal = 0;
      for(let fi = 0; fi < sal.length; fi++){
        const frame = sal[fi];
        for(let m = MIDI_LOW; m <= MIDI_HIGH; m++){
          const v = frame[m] || 0;
          if(v > maxSal) maxSal = v;
        }
      }
      if(maxSal < 0.001) maxSal = 1;

      // Draw each frame as vertical strip
      const firstFrame = Math.max(0, Math.floor(st.viewStart / hop));
      const lastFrame  = Math.min(sal.length - 1, Math.ceil(st.viewEnd / hop));

      for(let fi = firstFrame; fi <= lastFrame; fi++){
        const tFrame = fi * hop;
        const x = tToX(tFrame, W);
        if(x + colW < KEY_W || x > W) continue;

        const frame = sal[fi];
        for(let m = MIDI_LOW; m <= MIDI_HIGH; m++){
          const v = (frame[m] || 0) / maxSal;
          if(v < 0.04) continue; // skip noise floor

          const y  = midiToY(m, H);
          const [r,g,b2] = noteRGB[m - MIDI_LOW];

          // Colour: low energy → deep purple tint, high energy → note colour bright
          // Mimics Melodyne's blob rendering: soft glow that peaks at the note frequency
          const alpha = Math.pow(v, 0.55) * 0.72; // gamma-corrected for perceptual pop
          ctx2d.fillStyle = `rgba(${r},${g},${b2},${alpha})`;
          ctx2d.fillRect(
            Math.max(KEY_W, x),
            y,
            Math.min(colW + 0.5, W - Math.max(KEY_W, x)),
            noteH
          );
        }
      }

      // Soft vertical blur pass — draw semi-transparent neighbours for glow effect
      // (simulate the Melodyne "blob" softness: spread energy ±1 semitone)
      ctx2d.save();
      ctx2d.globalCompositeOperation = "source-over";
      for(let fi = firstFrame; fi <= lastFrame; fi += 2){ // every other frame for perf
        const tFrame = fi * hop;
        const x = tToX(tFrame, W);
        if(x + colW < KEY_W || x > W) continue;
        const frame = sal[fi];
        for(let m = MIDI_LOW + 1; m < MIDI_HIGH; m++){
          const vAbove = (frame[m+1] || 0) / maxSal;
          const vBelow = (frame[m-1] || 0) / maxSal;
          const spread = (vAbove + vBelow) * 0.18;
          if(spread < 0.03) continue;
          const y = midiToY(m, H);
          const [r,g,b2] = noteRGB[m - MIDI_LOW];
          ctx2d.fillStyle = `rgba(${r},${g},${b2},${spread})`;
          ctx2d.fillRect(Math.max(KEY_W,x), y, Math.min(colW+0.5,W-Math.max(KEY_W,x)), noteH);
        }
      }
      ctx2d.restore();
    }

    // ── Grid de compassos (desenhado por cima do heatmap) ──────────────────
    const beatSec = 60 / st.bpm;
    const firstBeat = Math.ceil(st.viewStart / beatSec) * beatSec;
    for(let t = firstBeat; t < st.viewEnd; t += beatSec){
      const x = tToX(t, W);
      const isMeasure = Math.round(t / beatSec) % 4 === 0;
      ctx2d.strokeStyle = isMeasure ? "rgba(129,140,248,0.22)" : "rgba(107,95,187,0.08)";
      ctx2d.lineWidth = isMeasure ? 1 : 0.5;
      ctx2d.beginPath(); ctx2d.moveTo(x,0); ctx2d.lineTo(x,H); ctx2d.stroke();
      if(isMeasure){
        ctx2d.fillStyle = "rgba(129,140,248,0.40)";
        ctx2d.font = "8px monospace";
        ctx2d.fillText(`${Math.round(t/beatSec/4)+1}`, x+2, 9);
      }
    }

    // ── Teclas piano (esquerda) ────────────────────────────────────────────
    for(let m = MIDI_LOW; m <= MIDI_HIGH; m++){
      const ni = m % 12;
      const isBlack = [1,3,6,8,10].includes(ni);
      const y = midiToY(m, H);
      ctx2d.fillStyle = isBlack ? "#1a1530" : "#2a2448";
      ctx2d.fillRect(0, y, KEY_W-1, noteH);
      if(!isBlack){
        ctx2d.strokeStyle = "rgba(107,95,187,0.3)";
        ctx2d.lineWidth = 0.5;
        ctx2d.beginPath(); ctx2d.moveTo(0,y+noteH); ctx2d.lineTo(KEY_W-1,y+noteH); ctx2d.stroke();
      }
      if(ni===0){
        ctx2d.fillStyle = "rgba(129,140,248,0.5)";
        ctx2d.fillRect(0, y, KEY_W-1, noteH);
        ctx2d.fillStyle = "rgba(220,200,255,0.9)";
        ctx2d.font = "bold 7px monospace";
        ctx2d.fillText(`C${Math.floor(m/12)-1}`, 2, y+noteH-2);
      } else if([4,7,9,11].includes(ni)){
        ctx2d.fillStyle = "rgba(107,95,187,0.4)";
        ctx2d.font = "6px monospace";
        ctx2d.fillText(NOTES[ni], 2, y+noteH-2);
      }
    }

    // ── Notas MIDI (por cima do heatmap) ──────────────────────────────────
    const notesToDraw = st.notes;
    notesToDraw.forEach(n=>{
      const m = n.midiNote;
      if(m < MIDI_LOW || m > MIDI_HIGH) return;
      const tS = n.tStart !== undefined ? n.tStart : n.tMs/1000;
      const tE = n.tEnd   !== undefined ? n.tEnd   : (n.tMs + n.durMs)/1000;
      const x1 = tToX(tS, W);
      const x2 = tToX(tE, W);
      if(x2 < KEY_W || x1 > W) return;
      const y  = midiToY(m, H) + 1;
      const ww = Math.max(3, x2 - x1 - 1);
      const hh = Math.max(2, noteH - 2);
      const ni   = m % 12;
      const col  = NC[NOTES[ni]] || "#818CF8";
      const isSel = st.selectedNotes.has(n);
      const vel  = (n.velocity || 80) / 127;
      const r=parseInt(col.slice(1,3),16), g=parseInt(col.slice(3,5),16), b2=parseInt(col.slice(5,7),16);

      if(isSel){ ctx2d.shadowColor=col; ctx2d.shadowBlur=10; }

      // Note body — solid with velocity-based brightness
      const alpha = 0.55 + vel * 0.40;
      ctx2d.fillStyle = `rgba(${r},${g},${b2},${alpha})`;
      ctx2d.beginPath();
      if(ctx2d.roundRect) ctx2d.roundRect(Math.max(KEY_W,x1), y, Math.min(ww, W-Math.max(KEY_W,x1)), hh, 3);
      else ctx2d.rect(Math.max(KEY_W,x1), y, Math.min(ww, W-Math.max(KEY_W,x1)), hh);
      ctx2d.fill();

      // Top highlight stripe
      ctx2d.fillStyle = `rgba(255,255,255,${0.12 + vel*0.1})`;
      ctx2d.fillRect(Math.max(KEY_W,x1)+1, y+1, Math.min(ww-2, W-Math.max(KEY_W,x1)-2), 2);

      // Border
      ctx2d.strokeStyle = isSel ? "#fff" : `rgba(${r},${g},${b2},1)`;
      ctx2d.lineWidth = isSel ? 1.5 : 1;
      ctx2d.beginPath();
      if(ctx2d.roundRect) ctx2d.roundRect(Math.max(KEY_W,x1), y, Math.min(ww, W-Math.max(KEY_W,x1)), hh, 3);
      else ctx2d.rect(Math.max(KEY_W,x1), y, Math.min(ww, W-Math.max(KEY_W,x1)), hh);
      ctx2d.stroke();
      ctx2d.shadowBlur = 0;

      // Label
      if(ww > 18 && hh > 8){
        ctx2d.fillStyle = "rgba(255,255,255,0.9)";
        ctx2d.font = `bold ${Math.min(8, hh-2)}px monospace`;
        ctx2d.fillText(NOTES[ni], Math.max(KEY_W,x1)+3, y+hh-3);
      }

      // Resize handle
      if(isSel && ww > 8){
        ctx2d.fillStyle = "rgba(255,255,255,0.7)";
        ctx2d.fillRect(Math.min(x1+ww,W)-4, y+1, 3, hh-2);
      }
    });

    // ── Playhead ───────────────────────────────────────────────────────────
    if(st.playheadT !== undefined){
      const px = tToX(st.playheadT, W);
      if(px >= KEY_W && px <= W){
        ctx2d.strokeStyle = "rgba(251,191,36,0.85)";
        ctx2d.lineWidth = 1.5;
        ctx2d.setLineDash([4,3]);
        ctx2d.beginPath(); ctx2d.moveTo(px,0); ctx2d.lineTo(px,H); ctx2d.stroke();
        ctx2d.setLineDash([]);
      }
    }

    // ── Scrollbar ─────────────────────────────────────────────────────────
    const total = Math.max(st.duration, 1);
    const thumbLeft = (st.viewStart / total) * scrollbar.offsetWidth;
    const thumbW    = Math.max(20, ((st.viewEnd - st.viewStart) / total) * scrollbar.offsetWidth);
    scrollThumb.style.left  = thumbLeft + "px";
    scrollThumb.style.width = thumbW + "px";
  }

  // ── Interação no roll ──────────────────────────────────────────────────────
  function hitNote(x, y, W, H){
    const t = xToT(x, W);
    const m = yToMidi(y, H);
    const noteH = H / MIDI_COUNT;
    for(let i = st.notes.length-1; i>=0; i--){
      const n = st.notes[i];
      if(n.midiNote !== m) continue;
      const x1 = tToX(n.tStart, W);
      const x2 = tToX(n.tEnd, W);
      if(x >= x1-2 && x <= x2+4) return {note:n, handle: x > x2-6 ? "resize" : "move"};
    }
    return null;
  }

  function getCanvasPos(e){
    const rect = rollCanvas.getBoundingClientRect();
    const scaleX = rollCanvas.width / rect.width;
    const scaleY = rollCanvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return {x:(src.clientX-rect.left)*scaleX, y:(src.clientY-rect.top)*scaleY};
  }

  rollCanvas.addEventListener("mousedown", onRollDown);
  rollCanvas.addEventListener("touchstart", e=>{e.preventDefault();onRollDown(e);},{passive:false});

  let _panning = false, _panStartX = 0, _panViewStart = 0, _panViewEnd = 0;

  function onRollDown(e){
    const {x,y} = getCanvasPos(e);
    const W = rollCanvas.width, H = rollCanvas.height;
    if(x < KEY_W){ /* click na tecla: tocar nota */
      const m = yToMidi(y, H);
      if(m>=MIDI_LOW && m<=MIDI_HIGH){
        const ni = m%12;
        playNote(ni, Math.floor(m/12)-1, 0.6);
        flashNote(NOTES[ni], 500);
      }
      return;
    }
    if(st.tool === "select"){
      const hit = hitNote(x,y,W,H);
      if(hit){
        if(!st.selectedNotes.has(hit.note)){
          if(!e.shiftKey) st.selectedNotes.clear();
          st.selectedNotes.add(hit.note);
        }
        if(hit.handle === "resize"){ st.resizeNote = hit.note; }
        else { st.dragNote = hit.note; st.dragOffsetX = xToT(x,W) - hit.note.tStart; }
      } else {
        st.selectedNotes.clear();
        // Pan
        _panning=true; _panStartX=x; _panViewStart=st.viewStart; _panViewEnd=st.viewEnd;
      }
    } else if(st.tool === "draw"){
      const t = xToT(x,W);
      const m = yToMidi(y,H);
      if(m>=MIDI_LOW && m<=MIDI_HIGH){
        const beatSec = 60/st.bpm;
        const newNote = {midiNote:m, tStart:t, tEnd:t+beatSec/2, velocity:90};
        st.notes.push(newNote);
        st.selectedNotes.clear(); st.selectedNotes.add(newNote);
        st.drawNote = newNote;
        const ni=m%12; playNote(ni,Math.floor(m/12)-1,0.3); flashNote(NOTES[ni],300);
      }
    } else if(st.tool === "erase"){
      const hit = hitNote(x,y,W,H);
      if(hit){ st.notes = st.notes.filter(n=>n!==hit.note); st.selectedNotes.delete(hit.note); updateNoteList(); }
    }
    drawRoll();
  }

  window.addEventListener("mousemove", onRollMove);
  window.addEventListener("touchmove", e=>{if(st.dragNote||st.resizeNote||st.drawNote||_panning){e.preventDefault();onRollMove(e);}},{passive:false});

  function onRollMove(e){
    const {x,y} = getCanvasPos(e);
    const W=rollCanvas.width, H=rollCanvas.height;
    if(st.dragNote){
      const t = xToT(x,W) - st.dragOffsetX;
      const dur = st.dragNote.tEnd - st.dragNote.tStart;
      st.dragNote.tStart = Math.max(0,t);
      st.dragNote.tEnd   = st.dragNote.tStart + dur;
      if(!e.shiftKey){
        const m = yToMidi(y,H);
        if(m>=MIDI_LOW && m<=MIDI_HIGH) st.dragNote.midiNote=m;
      }
      drawRoll();
    } else if(st.resizeNote){
      const t = xToT(x,W);
      if(t > st.resizeNote.tStart + 0.05) st.resizeNote.tEnd = t;
      drawRoll();
    } else if(st.drawNote){
      const t = xToT(x,W);
      if(t > st.drawNote.tStart + 0.05) st.drawNote.tEnd = t;
      drawRoll();
    } else if(_panning){
      const span = _panViewEnd - _panViewStart;
      const dt   = (x - _panStartX) / ((W-KEY_W)/(span));
      const ns   = Math.max(0, _panViewStart - dt);
      const ne   = Math.min(st.duration, ns + span);
      st.viewStart=Math.max(0,ne-span); st.viewEnd=ne;
      drawRoll();
    }
  }

  window.addEventListener("mouseup",  onRollUp);
  window.addEventListener("touchend", onRollUp);
  function onRollUp(){
    if(st.dragNote || st.resizeNote || st.drawNote){ updateNoteList(); }
    st.dragNote=null; st.resizeNote=null; st.drawNote=null; _panning=false;
  }

  // Scrollbar drag
  let _sbDrag=false, _sbStartX=0, _sbViewStart0=0;
  scrollbar.addEventListener("mousedown", e=>{
    _sbDrag=true; _sbStartX=e.clientX; _sbViewStart0=st.viewStart;
  });
  window.addEventListener("mousemove", e=>{
    if(!_sbDrag) return;
    const span = st.viewEnd - st.viewStart;
    const total = Math.max(st.duration,1);
    const dt = (e.clientX - _sbStartX) / scrollbar.offsetWidth * total;
    st.viewStart = Math.max(0, Math.min(total-span, _sbViewStart0+dt));
    st.viewEnd   = st.viewStart + span;
    drawRoll();
  });
  window.addEventListener("mouseup", ()=>{ _sbDrag=false; });

  // Wheel zoom
  rollCanvas.addEventListener("wheel", e=>{
    e.preventDefault();
    const {x} = getCanvasPos(e);
    const W = rollCanvas.width;
    const t = xToT(x, W);
    const factor = e.deltaY > 0 ? 1.12 : 0.88;
    const span = (st.viewEnd-st.viewStart)*factor;
    const ns = t - (t-st.viewStart)*factor;
    st.viewStart = Math.max(0, ns);
    st.viewEnd   = Math.min(st.duration, st.viewStart+span);
    if(st.viewEnd-st.viewStart < 0.3){ st.viewEnd=st.viewStart+0.3; }
    drawRoll();
  },{passive:false});

  // ══ ANÁLISE DE FICHEIRO (onset detection) ══════════════════════════════════
  async function startFileAnalysis(res){
    if(!res._audioBuffer){ statusDiv.textContent = "⚠ Buffer de áudio não disponível. Carrega o ficheiro novamente."; return; }
    srcBtnFile.disabled = true;
    srcBtnMic.disabled  = true;
    statusDiv.textContent = "🔍 A analisar ficheiro com onset detection…";
    progressFill.style.width = "5%";

    try {
      const result = await analyseMidiFromBuffer(res._audioBuffer, pct=>{
        progressFill.style.width = (5 + pct*90) + "%";
        statusDiv.textContent = `🔍 A processar… ${Math.round(pct*100)}%`;
      });
      st.notes    = result.notes;
      st.bpm      = result.bpmEst;
      st.duration = result.duration;
      st.salienceHistory = result.salienceHistory;
      st.hopSec   = result.hopSec;
      st.viewStart= 0;
      st.viewEnd  = Math.min(st.duration, 20);
      bpmLabel.textContent = `♩=${st.bpm}`;
      progressFill.style.width = "100%";
      statusDiv.textContent = `✅ ${result.notes.length} notas detetadas · BPM estimado: ${result.bpmEst}`;
      drawRoll(); updateNoteList();
      setTimeout(()=>{ progressFill.style.width="0%"; },1500);
    } catch(err){
      statusDiv.textContent = "❌ Erro na análise: " + err.message;
    }
    srcBtnFile.disabled = false;
    srcBtnMic.disabled  = false;
  }

  // ══ CAPTURA AO VIVO (microfone) ════════════════════════════════════════════
  async function startMicCapture(){
    if(st.isRunning){ stopMic(); return; }
    statusDiv.textContent = "A pedir acesso ao microfone…";
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      st.micStream = stream;
      const audioCtx = new(window.AudioContext||window.webkitAudioContext)();
      st.audioCtx = audioCtx;
      const micSrc = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0.5;
      micSrc.connect(analyser);
      st.analyser = analyser;
      st.isRunning = true;
      st.liveStart = performance.now();
      st.liveHistory = [];
      st.duration = 30;
      st.viewStart = 0; st.viewEnd = 30;
      specWrap.style.display = "block";

      srcBtnMic.textContent = "⏹ Parar";
      srcBtnMic.style.background = "rgba(239,68,68,0.15)";
      srcBtnMic.style.borderColor = "rgba(239,68,68,0.4)";
      srcBtnMic.style.color = "#FCA5A5";

      statusDiv.textContent = "🔴 A capturar via microfone… toca o teu instrumento!";

      const bufLen = analyser.frequencyBinCount;
      const dataArr = new Float32Array(bufLen);
      const sampleRate = audioCtx.sampleRate;
      const freqPerBin = sampleRate / (bufLen * 2);
      const lastNoteOnset = {};
      const LIVE_MIDI_LOW=48, LIVE_MIDI_HIGH=84;

      function liveLoop(){
        if(!st.isRunning) return;
        analyser.getFloatFrequencyData(dataArr);

        // Draw spectrum
        {
          const sCtx = specCanvas.getContext("2d");
          const SW=specCanvas.width, SH=specCanvas.height;
          sCtx.clearRect(0,0,SW,SH);
          const maxBin=Math.min(bufLen,Math.floor(5000/freqPerBin));
          sCtx.beginPath();
          for(let i=1;i<maxBin;i++){
            const val=(dataArr[i]+140)/140;
            const x=(i/maxBin)*SW;
            const y=SH-Math.max(0,val)*(SH-2)-1;
            if(i===1)sCtx.moveTo(x,SH);else sCtx.lineTo(x,y);
          }
          sCtx.lineTo(SW,SH);sCtx.closePath();
          const g=sCtx.createLinearGradient(0,0,0,SH);
          g.addColorStop(0,"rgba(251,191,36,0.8)");g.addColorStop(1,"rgba(52,211,153,0.15)");
          sCtx.fillStyle=g; sCtx.fill();
        }

        // Pitch detection + live notes + live salience for heatmap
        const now = (performance.now() - st.liveStart)/1000;
        const liveSalFrame = {};
        for(let m=LIVE_MIDI_LOW;m<=LIVE_MIDI_HIGH;m++){
          const f0=440*Math.pow(2,(m-69)/12);
          let sal=0;
          for(let h=1;h<=5;h++){
            const hf=f0*h; if(hf>sampleRate*0.47)break;
            const bin=Math.round(hf/freqPerBin);
            if(bin<bufLen){ const db=dataArr[bin]; if(db>-120) sal+=Math.pow(10,db/20)/Math.sqrt(h); }
          }
          const norm=Math.min(1,sal*5);
          liveSalFrame[m] = norm;
          if(norm>0.25){
            const last=lastNoteOnset[m];
            if(!last || now-last.tEnd>0.05){
              const newN={midiNote:m,tStart:now,tEnd:now+0.15,tMs:now*1000,durMs:150,velocity:Math.round(norm*127)};
              st.liveHistory.push(newN);
              st.notes.push(newN);
              lastNoteOnset[m]={tEnd:now+0.12};
              const ni=m%12;
              if(norm>0.5) flashNote(NOTES[ni],200);
            } else {
              if(last) last.tEnd=now+0.05;
            }
          }
        }
        st.liveSalience.push(liveSalFrame);
        st.salienceHistory = st.liveSalience;
        st.hopSec = 1/24;

        // Scroll view with live recording
        if(now > st.viewEnd - 2){
          const span=st.viewEnd-st.viewStart;
          st.viewEnd=now+3; st.viewStart=st.viewEnd-span;
        }
        st.duration = Math.max(st.duration, now+1);

        drawRoll(); updateNoteList();
        st.animFrame = requestAnimationFrame(liveLoop);
      }
      liveLoop();

    }catch(err){
      statusDiv.textContent = "❌ Microfone negado: " + (err.message||err);
    }
  }

  function stopMic(){
    st.isRunning=false;
    cancelAnimationFrame(st.animFrame);
    if(st.micStream) st.micStream.getTracks().forEach(t=>t.stop());
    specWrap.style.display="none";
    srcBtnMic.textContent="🎙 Microfone ao vivo";
    srcBtnMic.style.background="rgba(251,191,36,0.10)";
    srcBtnMic.style.borderColor="rgba(251,191,36,0.3)";
    srcBtnMic.style.color="#FCD34D";
    statusDiv.textContent=`⏹ Captura parada. ${st.notes.length} notas capturadas.`;
    // Fit view
    if(st.notes.length){ const last=Math.max(...st.notes.map(n=>n.tEnd)); st.viewStart=0; st.viewEnd=last+1; st.duration=last+1; }
    drawRoll(); updateNoteList();
  }

  // Override srcBtnMic to be a toggle
  srcBtnMic.onclick = ()=>{ st.isRunning ? stopMic() : startMicCapture(); };

  // Auto-seed with static analysis if available
  if(audioResult && audioResult.noteStrengths){
    statusDiv.textContent = "Clica em '🔍 Analisar Ficheiro' para detetar notas com timing, ou usa o microfone.";
  }
  drawRoll();
}

// ── Exportar MIDI com timing real ────────────────────────────────────────────
function exportMidiFromCapture(statusEl){
  const st = _midiCapState;
  if(!st || !st.notes.length){
    if(statusEl) statusEl.textContent = "Nenhuma nota para exportar.";
    return;
  }

  const tpq = 480;
  const tempo = Math.round(60000000 / st.bpm); // microseconds per beat
  const bytes = [];
  const wb = (v,n)=>{ for(let i=n-1;i>=0;i--) bytes.push((v>>(i*8))&0xFF); };

  // Header chunk: type 0, 1 track
  [0x4D,0x54,0x68,0x64].forEach(b=>bytes.push(b));
  wb(6,4); wb(0,2); wb(1,2); wb(tpq,2);

  // Build track events
  const events = [];
  const addEvt = (tick, ...data) => events.push({tick, data});

  // Tempo
  addEvt(0, 0xFF,0x51,0x03, (tempo>>16)&0xFF,(tempo>>8)&0xFF,tempo&0xFF);
  // Program change: Acoustic Grand Piano
  addEvt(0, 0xC0, 0x00);
  // Track name
  addEvt(0, 0xFF,0x03, 0x0C, ...Array.from("Paleta Musical").map(c=>c.charCodeAt(0)));

  st.notes.forEach(n=>{
    const tickOn  = Math.round(n.tStart * st.bpm / 60 * tpq);
    const tickOff = Math.round(n.tEnd   * st.bpm / 60 * tpq);
    const vel = Math.max(1, Math.min(127, n.velocity || 80));
    events.push({tick:tickOn,  data:[0x90, n.midiNote, vel]});
    events.push({tick:tickOff, data:[0x80, n.midiNote, 0]});
  });

  events.sort((a,b)=>a.tick!==b.tick ? a.tick-b.tick : (a.data[0]&0xF0)===0x80?1:-1);

  // Encode track
  const track = [];
  const tvlq = v=>{ const b=[v&0x7F]; v>>=7; while(v){b.unshift((v&0x7F)|0x80);v>>=7;} b.forEach(x=>track.push(x)); };
  let lastTick = 0;
  events.forEach(ev=>{
    tvlq(ev.tick - lastTick);
    lastTick = ev.tick;
    ev.data.forEach(b=>track.push(b));
  });
  // End of track
  tvlq(0); track.push(0xFF,0x2F,0x00);

  // MTrk header
  [0x4D,0x54,0x72,0x6B].forEach(b=>bytes.push(b));
  wb(track.length,4);
  track.forEach(b=>bytes.push(b));

  const blob = new Blob([new Uint8Array(bytes)],{type:"audio/midi"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a"); a.href=url; a.download="paleta-musical.mid"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  if(statusEl) statusEl.textContent = `✅ MIDI exportado! ${st.notes.length} notas · ${st.bpm} BPM`;
}

// ── Seed visual — kept for compatibility ─────────────────────────────────────
function _legacySeedRoll(audioResult){
  // No-op: the new engine doesn't use seed data
}

renderPage();
</script>
